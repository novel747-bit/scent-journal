<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scent Journal 香水紀錄</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; line-height: 1.6; }
    section { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { padding: 8px 15px; cursor: pointer; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-clear { background-color: #f44336; color: white; border: none; }
    .btn-submit { background-color: #4CAF50; color: white; border: none; }
    .result-card { border: 1px solid #eee; padding: 10px; margin-top: 10px; border-radius: 4px; background: #fafafa; }
  </style>
</head>
<body>

  <h1>Scent Journal 📖</h1>

  <!-- 區塊 1: 搜尋 JSON 資料庫 -->
  <section>
    <h2>🔍 搜尋香水庫</h2>
    <input type="text" id="searchInput" placeholder="輸入香水名稱、品牌或俗稱 (例如: 英國梨、Santal 33)">
    <div class="btn-group">
      <button onclick="searchFragrance()">搜尋</button>
      <button onclick="clearSearch()">清空搜尋</button>
    </div>
    <div id="searchResults"></div>
  </section>

  <!-- 區塊 2: 紀錄與新增表單 -->
  <section>
    <h2>✍️ 紀錄我的香水</h2>
    <form id="fragranceForm" onsubmit="handleSave(event)">
      
      <label for="brandInput">品牌:</label>
      <!-- 修正點 1: 使用 datalist 解決下拉選單叫不出來的問題，且允許自訂輸入 -->
      <input list="brandList" id="brandInput" required placeholder="請選擇或輸入品牌 (雙擊展開列表)">
      <datalist id="brandList">
        <option value="Jo Malone London">
        <option value="Le Labo">
        <option value="Diptyque">
        <option value="Byredo">
        <option value="Penhaligon's">
        <option value="Tom Ford">
      </datalist>

      <label for="nameInput">香水名稱:</label>
      <input type="text" id="nameInput" required placeholder="例如: English Pear & Freesia">

      <label for="topNotes">前調:</label>
      <input type="text" id="topNotes" placeholder="用逗號分隔">

      <label for="heartNotes">中調:</label>
      <input type="text" id="heartNotes" placeholder="用逗號分隔">

      <label for="baseNotes">後調:</label>
      <input type="text" id="baseNotes" placeholder="用逗號分隔">

      <div class="btn-group">
        <button type="submit" class="btn-submit">💾 儲存紀錄</button>
        <!-- 修正點 2: 加入一鍵清空按鈕 -->
        <button type="button" class="btn-clear" onclick="clearForm()">🗑️ 一鍵清空表單</button>
      </div>
    </form>
  </section>

  <script>
    // 儲存從 JSON 抓取下來的資料
    let dbFragrances = [];

    // 1. 網頁載入時，立刻獲取 fragrances.json 的資料
    async function loadDatabase() {
      try {
        const response = await fetch('./fragrances.json');
        if (!response.ok) throw new Error('Network response was not ok');
        dbFragrances = await response.json();
        console.log("✅ 香水資料庫載入成功", dbFragrances);
      } catch (error) {
        console.error("❌ 載入 fragrances.json 失敗", error);
      }
    }
    loadDatabase();

    // 2. 執行搜尋 (比對品牌、名稱與 aliases 別名)
    function searchFragrance() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = ''; // 清空上次搜尋結果

      if (!keyword) {
        resultsDiv.innerHTML = '<p style="color:red;">請輸入搜尋關鍵字</p>';
        return;
      }

      // 陣列過濾邏輯
      const results = dbFragrances.filter(item => {
        const matchName = item.name.toLowerCase().includes(keyword);
        const matchBrand = item.brand.toLowerCase().includes(keyword);
        const matchAlias = item.aliases.some(alias => alias.toLowerCase().includes(keyword));
        return matchName || matchBrand || matchAlias;
      });

      if (results.length === 0) {
        resultsDiv.innerHTML = '<p>找不到相符的香水，您可以直接在下方手動填寫！</p>';
      } else {
        results.forEach(item => {
          const div = document.createElement('div');
          div.className = "result-card";
          div.innerHTML = `
            <strong>${item.brand} - ${item.name}</strong> (${item.concentration})<br>
            <small style="color:gray;">別名: ${item.aliases.join(', ')}</small><br>
            <p style="font-size: 0.9em; margin: 5px 0;">
              <strong>前調:</strong> ${item.notes.top.join(', ')}<br>
              <strong>中調:</strong> ${item.notes.heart.join(', ')}<br>
              <strong>後調:</strong> ${item.notes.base.join(', ')}
            </p>
            <button onclick="fillForm('${item.id}')">匯入至下方表單</button>
          `;
          resultsDiv.appendChild(div);
        });
      }
    }

    // 3. 將搜尋到的香調一鍵帶入表單
    function fillForm(fragranceId) {
      const item = dbFragrances.find(f => f.id === fragranceId);
      if (item) {
        document.getElementById('brandInput').value = item.brand;
        document.getElementById('nameInput').value = item.name;
        document.getElementById('topNotes').value = item.notes.top.join(', ');
        document.getElementById('heartNotes').value = item.notes.heart.join(', ');
        document.getElementById('baseNotes').value = item.notes.base.join(', ');
        alert(`已將「${item.name}」的香調帶入表單！`);
      }
    }

    // 4. 清空搜尋框功能
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResults').innerHTML = '';
    }

    // 5. 修正點 2: 清空表單功能
    function clearForm() {
      document.getElementById('fragranceForm').reset();
    }

    // 6. 修正點 3: 儲存表單與強制清除快取殘留
    function handleSave(event) {
      event.preventDefault(); // 阻止表單預設的網頁重整

      // (未來這裡會加入將資料存進 IndexedDB 的邏輯)
      
      alert('紀錄已成功儲存至本地端！');

      // 儲存完畢後，強制清空表單，確保不會有上一次輸入的殘留
      clearForm();
    }
  </script>
</body>
</html>
